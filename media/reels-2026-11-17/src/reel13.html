<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="a/cjk.css">
<style>
@font-face{font-family:Pirkkala;src:url(a/Pirkkala.ttf);unicode-range:U+0000-00FF}
@font-face{font-family:LeeSeoyun;src:url(a/LeeSeoyun.ttf);unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Pirkkala,LeeSeoyun,sans-serif;color:#34463c;background:#eee;position:relative}
body.ja{font-family:Pirkkala,ZenMaru,sans-serif}body.tw{font-family:Pirkkala,WenKaiTC,sans-serif}
.bg{position:absolute;inset:0}
.abs{position:absolute;will-change:transform,opacity}
.brand{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:46px;letter-spacing:-1.8px;font-weight:600;z-index:41}
.brand i{font-style:normal;color:#d9532b}
#cap{position:absolute;top:146px;left:0;right:0;display:flex;justify-content:center;z-index:42}
#cap span{display:flex;align-items:center;gap:18px;background:#fafbf5f5;padding:20px 44px;border-radius:999px;font-size:62px;letter-spacing:-1.6px;font-weight:600;box-shadow:0 14px 44px #34463c30;white-space:nowrap;border:3px solid #34463c22}
body.ja #cap span,body.tw #cap span{letter-spacing:0;font-size:56px}
body.en #cap span{font-size:54px}
#cap svg{flex:none}
#name{position:absolute;top:296px;left:0;right:0;text-align:center;font-size:104px;font-weight:600;letter-spacing:-3px;z-index:40;white-space:nowrap;text-shadow:0 4px 0 #fff,0 0 30px #fff}
body.ja #name,body.tw #name{letter-spacing:0;font-size:92px}
body.en #name{font-size:88px}
#stage{position:absolute;left:50px;top:420px;width:980px;height:980px;z-index:10}
#stage img{position:absolute;inset:0;width:980px;height:980px;opacity:0}
#shadow{position:absolute;left:240px;top:1290px;width:600px;height:70px;border-radius:50%;background:radial-gradient(#0003,#0000 70%);z-index:9}
#notes{position:absolute;inset:0;z-index:12;pointer-events:none}
#card{position:absolute;left:70px;top:1392px;width:940px;height:190px;border-radius:44px;background:#fffffff2;box-shadow:0 20px 50px #34463c35;z-index:30;display:flex;align-items:center;padding:0 34px;gap:28px}
#disc{flex:none;width:126px;height:126px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 10px #0002,inset 0 0 0 44px #0000,0 6px 16px #0003}
#disc:after{content:"";width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #0002}
#disc i{position:absolute;width:126px;height:126px;border-radius:50%;background:conic-gradient(#fff0 0 20deg,#fff5 40deg,#fff0 60deg,#fff0 200deg,#fff4 220deg,#fff0 240deg)}
#ct{flex:1;min-width:0}
#ct small{display:block;font-size:34px;color:#7c8a82;font-weight:500;letter-spacing:-.5px}
#ct b{display:block;font-size:60px;font-weight:600;letter-spacing:-1.5px;color:var(--c);white-space:nowrap;line-height:1.15}
body.ja #ct b,body.tw #ct b{letter-spacing:0;font-size:52px}
body.en #ct b{font-size:52px}
#bars{flex:none;width:200px;height:120px;display:flex;align-items:flex-end;gap:6px}
#bars u{flex:1;background:var(--c);border-radius:6px;height:10%}
#dots{position:absolute;top:1616px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:30}
#dots u{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0002}
#flash{position:absolute;inset:0;background:#fff;z-index:35;opacity:0;pointer-events:none}
#end{position:absolute;inset:0;background:linear-gradient(#fdf6f3,#eef4f1);z-index:44;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;padding-bottom:140px}
#grid{display:grid;grid-template-columns:repeat(4,200px);gap:16px;justify-content:center}
#grid div{width:200px;height:200px;border-radius:32px;background:#fff;box-shadow:0 10px 26px #34463c22;overflow:hidden;position:relative}
#grid img{position:absolute;width:230px;height:230px;left:-15px;top:-15px;object-fit:contain}
#grid div i{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}
#end h1{font-size:104px;letter-spacing:-3px;text-align:center;line-height:1.12;font-weight:600}
body.ja #end h1,body.tw #end h1{letter-spacing:0;font-size:92px}
#end p{font-size:50px;color:#4f6157;letter-spacing:-1px}
#end h3{font-size:58px;font-weight:500;color:#fff;background:#2f5a43;padding:20px 56px;border-radius:999px}
#end small{font-size:40px;color:#6d7d74}
#snow{position:absolute;inset:0;z-index:13;pointer-events:none}
</style>
<body>
<div id="bgs"></div>
<div class="brand">houscaper<i>.</i></div>
<div id="cap"><span><svg width="64" height="64" viewBox="0 0 64 64"><path d="M8 24h12l16-13v42L20 40H8z" fill="#34463c"/><path id="w1" d="M44 22c5 5 5 15 0 20" fill="none" stroke="#d9532b" stroke-width="5" stroke-linecap="round"/><path id="w2" d="M51 14c9 9 9 27 0 36" fill="none" stroke="#d9532b" stroke-width="5" stroke-linecap="round"/></svg><em id="capt" style="font-style:normal"></em></span></div>
<div id="name"></div>
<div id="shadow"></div>
<div id="stage"></div>
<canvas id="notes" width="1080" height="1920"></canvas>
<canvas id="snow" width="1080" height="1920"></canvas>
<div id="card"><div id="disc"><i id="spin"></i></div><div id="ct"><small id="now"></small><b id="genre"></b></div><div id="bars"></div></div>
<div id="dots"></div>
<div id="flash"></div>
<div id="end"><div id="grid"></div><h1 id="endh"></h1><p id="endp"></p><h3>houscaper.xyz</h3><small id="ends"></small></div>
<script type="module">
const Q=new URLSearchParams(location.search),L=Q.get('l')||'ko';document.body.className=L;
const T={
 ko:{h:'집마다 음악이 달라요',now:'지금 나오는 음악',n:['한옥','일본 성','멕시코 마을','독일 목조 집','바이킹 마을','페르시아 중정집','뉴욕 브라운스톤','크리스마스 집'],
  g:['국악 · 가야금','고토 · 샤쿠하치','마리아치','움파 폴카','북유럽 포크','산투르 · 네이','비밥 재즈','재즈 왈츠 · 썰매 방울'],
  eh:'14가지 집,<br>14가지 음악',ep:'톡톡 지으면 그 집의 음악이 흘러요',es:'로그인 없이 바로 시작'},
 en:{h:'Every house has its own music',now:'Now playing',n:['Hanok','Japanese castle','Mexican village','German timber house','Viking village','Persian courtyard','New York brownstone','Christmas house'],
  g:['Gugak · gayageum','Koto · shakuhachi','Mariachi','Oompah polka','Nordic folk','Santur · ney','Bebop jazz','Jazz waltz · sleigh bells'],
  eh:'14 houses,<br>14 soundtracks',ep:'Tap to build and its music plays',es:'No sign-up needed'},
 ja:{h:'家ごとに音楽が変わる',now:'いま流れている音楽',n:['韓屋','日本の城','メキシコの村','ドイツの木組みの家','バイキングの村','ペルシャの中庭の家','ニューヨークの家','クリスマスの家'],
  g:['国楽・カヤグム','箏・尺八','マリアッチ','ウンパ・ポルカ','北欧フォーク','サントゥール・ネイ','ビバップ・ジャズ','ジャズワルツ・そりの鈴'],
  eh:'14の家、<br>14の音楽',ep:'タップで建てると、その家の音楽が流れる',es:'登録なしですぐ始められる'},
 tw:{h:'每種房子都有專屬音樂',now:'正在播放',n:['韓屋','日本城','墨西哥小鎮','德國木屋','維京村落','波斯庭院','紐約褐石屋','聖誕小屋'],
  g:['韓國國樂・伽倻琴','日本箏・尺八','墨西哥街頭樂隊','德式波卡','北歐民謠','波斯揚琴・奈伊笛','咆勃爵士','爵士華爾滋・雪橇鈴'],
  eh:'14種房子，<br>14種音樂',ep:'點一點蓋房子，專屬音樂就響起',es:'免註冊，立即開始'}}[L];
const A=await (await fetch('a/audio.json')).json();
const ORDER=A.order,SEG=A.seg,NS=ORDER.length,E0=NS*SEG;window.DUR=E0+A.end;
// accent colour and backdrop per style
const C={hanok:['#2f6f62','#f3ead6','#dfe9dc'],japan:['#b8436a','#fbe6ea','#f4eef0'],mexico:['#d9531e','#ffe7a8','#ffd9c2'],german:['#2f6b3a','#e3efd2','#f3ecd6'],
 viking:['#2f5f7a','#d5e3ea','#e6ece6'],persian:['#0f8b8d','#f6e7c4','#d3ece8'],newyork:['#a13d2d','#dfe3ef','#f1e2d6'],christmas:['#b8322b','#cfe0ea','#f4f8fa']};
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ip=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-(1-x)**3,eio=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2;
const back=x=>{const c=1.7;return 1+(c+1)*(x-1)**3+c*(x-1)**2};
$('bgs').innerHTML=ORDER.map((s,i)=>`<div class="bg" id="bg${i}" style="background:linear-gradient(${C[s][1]},${C[s][2]} 70%,#fafaf6);opacity:0"></div>`).join('');
const NR=21,rot=ORDER.map(s=>Array.from({length:NR},(_,i)=>{const a=new Image();a.onerror=()=>{a.onerror=null;a.src='a/rot-hanok/o000.png'};a.src=`a/rot-${s}/o${String(i).padStart(3,'0')}.png`;$('stage').appendChild(a);return a;}));
$('bars').innerHTML='<u></u>'.repeat(16);const bars=[...$('bars').children];
$('dots').innerHTML='<u></u>'.repeat(NS);const dots=[...$('dots').children];
$('capt').textContent=T.h;$('now').textContent=T.now;$('endh').innerHTML=T.eh;$('endp').textContent=T.ep;$('ends').textContent=T.es;
const ALL=['hanok','japan','mexico','german','viking','persian','newyork','christmas','castle','dutch','garden','coast'];
const C2={castle:'#6b6f7a',dutch:'#b0563b',garden:'#4f8a4a',coast:'#2f8fb0'};
const NOTE='<svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 4v10.2A3.5 3.5 0 1 0 11 17V8l7-1.6v6A3.5 3.5 0 1 0 20 15V2z" fill="#fff"/></svg>';
$('grid').innerHTML=ALL.map(s=>`<div style="--c:${(C[s]||[C2[s]])[0]}"><img src="a/thumbs/${s}.webp"><i>${NOTE}</i></div>`).join('');
const P=Array.from({length:14},(_,i)=>({ph:i/14,x:((i*397)%100)/100,s:.7+((i*31)%10)/14,w:((i*53)%10)/10}));
const FL=Array.from({length:90},(_,i)=>({x:(i*397)%1080,y:(i*733)%1920,r:3+(i*7)%7,v:60+(i*29)%90,w:.6+(i%5)*.3,p:i*1.7}));
const noteP=new Path2D('M9 4v10.2A3.5 3.5 0 1 0 11 17V8l7-1.6v6A3.5 3.5 0 1 0 20 15V2z');
await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode().catch(()=>new Promise(r=>setTimeout(r,500)).then(()=>i.decode()))));
let last=-1;
window.render=function(t){
 const si=Math.min(NS-1,Math.floor(t/SEG)),lt=t-si*SEG,s=ORDER[si],col=C[s][0];
 const fr=A.bars[Math.min(A.bars.length-1,Math.round(t*30))]||[],bass=((fr[0]||0)+(fr[1]||0)+(fr[2]||0))/3,lvl=fr.reduce((a,b)=>a+b,0)/16;
 document.body.style.setProperty('--c',col);
 ORDER.forEach((_,i)=>{$('bg'+i).style.opacity=i<si?1:i===si?(si===0?1:eo(ip(lt,0,.25))):0;});
 if(si!==last){$('name').textContent=T.n[si];$('genre').textContent=T.g[si];last=si;}
 // house: pops in on the cut, turns slowly, bobs with the bass
 const k=cl(lt/(si===NS-1?SEG+.6:SEG)),f=k*(NR-1),f0=Math.floor(f),ff=f-f0,pin=back(ip(lt,0,.34)),inA=ip(lt,0,.1);
 rot.forEach((arr,i)=>arr.forEach((im,j)=>{im.style.opacity=i!==si?0:j===f0?inA:j===f0+1?inA*ff:0;}));
 $('stage').style.transform=`translateY(${-bass*10}px) scale(${(.86+.14*pin)*(1+bass*.018)}) rotate(${(1-eo(ip(lt,0,.4)))*-3}deg)`;
 $('shadow').style.transform=`scale(${.9+.1*pin-bass*.03})`;$('shadow').style.opacity=inA;
 $('flash').style.opacity=si>0?(1-ip(lt,0,.16))*.55:0;
 const np=ip(lt,.02,.36);$('name').style.color=col;$('name').style.opacity=cl(np*3);$('name').style.transform=`translateY(${(1-eo(np))*26}px) scale(${.8+.2*back(np)})`;
 const cp=ip(lt,.05,.4);$('card').style.transform=`translateY(${(1-eo(cp))*18}px) scale(${.96+.04*back(cp)})`;
 $('genre').style.opacity=cl(cp*2.5);$('spin').style.transform=`rotate(${t*150}deg)`;
 bars.forEach((b,i)=>b.style.height=(10+90*(fr[i]||0))+'%');
 dots.forEach((d,i)=>{d.style.background=i===si?col:i<si?'#34463c55':'#fff';d.style.transform=`scale(${i===si?1.35:1})`;});
 const wv=.5+.5*Math.sin(t*9);$('w1').style.opacity=.45+.55*lvl;$('w2').style.opacity=.25+.75*wv*cl(lvl*1.6);
 const hp=eo(ip(t,0,.5));$('cap').style.opacity=hp;$('cap').style.transform=`translateY(${(1-hp)*-30}px) scale(${1+.03*Math.sin(cl(t/1.2)*Math.PI)})`;
 // music notes drifting up from the house
 const cx=$('notes').getContext('2d');cx.clearRect(0,0,1080,1920);cx.fillStyle=col;
 P.forEach((p,i)=>{const u=((t*.42+p.ph)%1),side=i%2?1:-1,x=540+side*(250+p.x*230)+Math.sin(u*6+i)*26,y=1250-u*760-p.w*120;
  cx.save();cx.globalAlpha=Math.sin(u*Math.PI)*.75*cl(.35+lvl);cx.translate(x,y);cx.rotate(Math.sin(u*5+i)*.3);const z=p.s*(2.6+bass*.7);cx.scale(z,z);cx.fill(noteP);cx.restore();});
 const sc=$('snow').getContext('2d');sc.clearRect(0,0,1080,1920);
 if(s==='christmas'){sc.fillStyle='#fff';sc.shadowColor='#7f9aab';sc.shadowBlur=6;const a=ip(lt,0,.4);FL.forEach(q=>{const y=(q.y+t*q.v)%2000-40,x=q.x+Math.sin(t*q.w+q.p)*30;sc.globalAlpha=.85*a;sc.beginPath();sc.arc(x,y,q.r,0,7);sc.fill();});sc.globalAlpha=1;sc.shadowBlur=0;}
 const ea=eo(ip(t,E0+.6,E0+1.0));$('end').style.opacity=ea;$('grid').style.transform=`scale(${.92+.08*back(ea)})`;
 [...$('grid').children].forEach((d,i)=>{const q=ip(t,E0+.7+i*.05,E0+1.05+i*.05);d.style.transform=`scale(${.5+.5*back(q)*(1+.04*bass)})`;d.style.opacity=cl(q*2);});
};
window.__ok=true;
</script>
</body>
